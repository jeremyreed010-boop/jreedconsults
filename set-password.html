<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Password — J. Reed Consults</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
</head>
<body>
<div class="container" style="max-width:420px;margin-top:80px;">
  <h1>Set Password</h1>
  <p class="subtitle">Pick a password you'll remember. Used next time you sign in.</p>
  <div class="card">
    <form id="set-form">
      <label for="password">New password</label>
      <input id="password" type="password" required minlength="8" autocomplete="new-password">
      <label for="confirm" style="margin-top:14px;">Confirm password</label>
      <input id="confirm" type="password" required minlength="8" autocomplete="new-password">
      <button class="primary" type="submit">Save password</button>
      <p class="error" id="err" style="display:none"></p>
      <p class="success" id="ok" style="display:none"></p>
    </form>
  </div>
</div>
<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

(async function checkSession() {
  // Supabase JS reads the token from the URL hash on load
  await new Promise(r => setTimeout(r, 300));
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    const err = document.getElementById('err');
    err.textContent = 'Reset link expired or invalid. Go back to login and request a new one.';
    err.style.display = 'block';
    document.querySelector('button.primary').disabled = true;
  }
})();

document.getElementById('set-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('confirm').value;
  const err = document.getElementById('err');
  const ok = document.getElementById('ok');
  err.style.display = 'none';
  ok.style.display = 'none';
  if (p1 !== p2) {
    err.textContent = 'Passwords do not match.';
    err.style.display = 'block';
    return;
  }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) {
    err.textContent = error.message;
    err.style.display = 'block';
    return;
  }
  ok.textContent = 'Password saved. Redirecting…';
  ok.style.display = 'block';
  setTimeout(() => { window.location.href = '/dashboard.html'; }, 800);
});
</script>
</body>
</html>
