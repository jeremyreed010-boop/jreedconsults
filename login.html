<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — J. Reed Consults</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
</head>
<body>
<div class="container" style="max-width:420px;margin-top:80px;">
  <h1>J. Reed Consults</h1>
  <p class="subtitle">Sign in to your dashboard</p>
  <div class="card">
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password" style="margin-top:14px;">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="(leave blank to use magic link)">
      <button class="primary" type="submit">Sign in</button>
      <p class="error" id="err" style="display:none"></p>
      <p class="success" id="ok" style="display:none"></p>
      <p style="margin-top:18px;font-size:12px;">
        <a href="#" id="reset-link" style="color:#1b4332;">Set or reset password →</a>
      </p>
    </form>
  </div>
</div>
<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

function showError(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('ok').style.display = 'none';
}
function showOk(msg) {
  const el = document.getElementById('ok');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('err').style.display = 'none';
}

document.getElementById('login-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (password) {
    // Password sign-in
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      showError(error.message);
    } else {
      window.location.href = '/dashboard.html';
    }
  } else {
    // Magic link
    const { error } = await sb.auth.signInWithOtp({
      email: email,
      options: { emailRedirectTo: window.location.origin + '/auth-callback.html' }
    });
    if (error) {
      showError(error.message);
    } else {
      showOk('Check your email for a sign-in link.');
    }
  }
});

document.getElementById('reset-link').addEventListener('click', async function (e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) {
    showError('Enter your email first, then click "Set or reset password."');
    return;
  }
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/set-password.html'
  });
  if (error) {
    showError(error.message);
  } else {
    showOk('Check your email for a password-set link.');
  }
});
</script>
</body>
</html>
